<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">MaatiTrace journey from land registration to action</title>
  <desc id="desc">Five connected stages: identity, land, crop, intelligence and action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbf2"/><stop offset="1" stop-color="#eef7ef"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#709b56"/><stop offset="1" stop-color="#1f7462"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#294632" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <path d="M190 206 H1410" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)"><circle cx="190" cy="206" r="80" fill="#fff" stroke="#709b56" stroke-width="5"/><text x="190" y="198" font-size="26" font-weight="700" fill="#294632">IDENTITY</text><text x="190" y="230" font-size="18" fill="#5e7160">Farmer + FPO</text></g>
    <g filter="url(#shadow)"><circle cx="495" cy="206" r="80" fill="#fff" stroke="#79a98f" stroke-width="5"/><text x="495" y="198" font-size="26" font-weight="700" fill="#294632">LAND</text><text x="495" y="230" font-size="18" fill="#5e7160">Boundary + place</text></g>
    <g filter="url(#shadow)"><circle cx="800" cy="206" r="80" fill="#fff" stroke="#d1a052" stroke-width="5"/><text x="800" y="198" font-size="26" font-weight="700" fill="#294632">CROP</text><text x="800" y="230" font-size="18" fill="#5e7160">Stage + evidence</text></g>
    <g filter="url(#shadow)"><circle cx="1105" cy="206" r="80" fill="#fff" stroke="#4d7ca0" stroke-width="5"/><text x="1105" y="198" font-size="26" font-weight="700" fill="#294632">SIGNAL</text><text x="1105" y="230" font-size="18" fill="#5e7160">AI + ML insight</text></g>
    <g filter="url(#shadow)"><circle cx="1410" cy="206" r="80" fill="#fff" stroke="#b77a4a" stroke-width="5"/><text x="1410" y="198" font-size="26" font-weight="700" fill="#294632">ACTION</text><text x="1410" y="230" font-size="18" fill="#5e7160">Alert + follow-up</text></g>
    <text x="800" y="70" font-size="30" font-weight="700" fill="#294632">From land to intelligence</text>
    <text x="800" y="370" font-size="20" fill="#5e7160">A connected farm record that becomes more useful over time.</text>
  </g>
</svg>
