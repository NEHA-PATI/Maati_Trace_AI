<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">MaatiTrace consent-aware FPO connection flow</title>
  <desc id="desc">A farmer selects an FPO, reviews sharing, confirms consent, the FPO reviews, and the relationship becomes active.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f8fbf4"/><stop offset="1" stop-color="#eef7f5"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b7c68"/></marker></defs>
  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <g fill="none" stroke="#4b7c68" stroke-width="6" marker-end="url(#arrow)"><path d="M275 180 H370"/><path d="M570 180 H665"/><path d="M865 180 H960"/><path d="M1160 180 H1255"/></g>
    <g text-anchor="middle">
      <g><rect x="55" y="105" width="220" height="150" rx="22" fill="#fff" stroke="#78a96d" stroke-width="4"/><text x="165" y="150" font-size="20" font-weight="700" fill="#294632">Select FPO</text><text x="165" y="182" font-size="16" fill="#5e7160">Farmer chooses</text><text x="165" y="207" font-size="16" fill="#5e7160">a relationship</text></g>
      <g><rect x="370" y="105" width="220" height="150" rx="22" fill="#fff" stroke="#78a96d" stroke-width="4"/><text x="480" y="150" font-size="20" font-weight="700" fill="#294632">Review sharing</text><text x="480" y="182" font-size="16" fill="#5e7160">Purpose and scope</text><text x="480" y="207" font-size="16" fill="#5e7160">are visible</text></g>
      <g><rect x="665" y="105" width="220" height="150" rx="22" fill="#fff" stroke="#d1a052" stroke-width="4"/><text x="775" y="150" font-size="20" font-weight="700" fill="#294632">Confirm consent</text><text x="775" y="182" font-size="16" fill="#5e7160">Farm-level choice</text><text x="775" y="207" font-size="16" fill="#5e7160">is recorded</text></g>
      <g><rect x="960" y="105" width="220" height="150" rx="22" fill="#fff" stroke="#4d7ca0" stroke-width="4"/><text x="1070" y="150" font-size="20" font-weight="700" fill="#294632">FPO review</text><text x="1070" y="182" font-size="16" fill="#5e7160">Accept or decline</text><text x="1070" y="207" font-size="16" fill="#5e7160">with context</text></g>
      <g><rect x="1255" y="105" width="290" height="150" rx="22" fill="#e4f2e6" stroke="#4b7c68" stroke-width="4"/><text x="1400" y="150" font-size="20" font-weight="700" fill="#294632">Active relationship</text><text x="1400" y="182" font-size="16" fill="#5e7160">Shared intelligence</text><text x="1400" y="207" font-size="16" fill="#5e7160">within the chosen scope</text></g>
    </g>
  </g>
</svg>
